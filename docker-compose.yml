services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agnos
      POSTGRES_USER: agnos
      POSTGRES_PASSWORD: agnos_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./migrations/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agnos -d agnos"]
      interval: 5s
      timeout: 3s
      retries: 10

  hospital-a-mock:
    image: nginx:1.27-alpine
    volumes:
      - ./mock-hospital-a:/usr/share/nginx/html:ro
      - ./docker/mock-nginx.conf:/etc/nginx/conf.d/default.conf:ro

  test:
    image: golang:1.25-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: ["go", "test", "./...", "-cover"]
    profiles: ["test"]

volumes:
  postgres_data:
